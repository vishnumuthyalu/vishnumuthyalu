<svg xmlns="http://www.w3.org/2000/svg" width="425" height="262" viewBox="0 0 425 262" role="img" aria-label="Relay: git push → plain-English update emails for clients">
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
