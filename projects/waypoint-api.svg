<svg xmlns="http://www.w3.org/2000/svg" width="425" height="262" viewBox="0 0 425 262" role="img" aria-label="Waypoint: URL shortener split into 4 TypeScript microservices">
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .t { fill: #58a6ff; font-size: 19px; font-weight: 700; }
  .tag { fill: #c9d1d9; font-size: 12px; }
  .b { fill: #c9d1d9; font-size: 11.5px; }
  .ar { fill: #58a6ff; font-size: 11.5px; }
  .chip { fill: #c9d1d9; font-size: 10.5px; }
  .bar { fill: #6e7681; font-size: 11px; }
  .go { fill: #58a6ff; font-size: 11px; }
  .ln { opacity: 0; animation: in .4s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
<rect x=".5" y=".5" width="424" height="261" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="3" height="260" rx="1.5" fill="#58a6ff"/>
<path d="M.5 30.5h424" stroke="#30363d"/>
<circle cx="20" cy="15.5" r="5" fill="#ff5f57"/><circle cx="36" cy="15.5" r="5" fill="#febc2e"/><circle cx="52" cy="15.5" r="5" fill="#28c840"/>
<text x="72" y="19.5" class="bar">~/projects/waypoint-api</text>
<text x="409" y="19.5" text-anchor="end" class="go">view repo ↗</text>
<g class="ln" style="animation-delay:0.15s"><text x="22" y="68" class="t">Waypoint</text></g>
<g class="ln" style="animation-delay:0.24s"><text x="22" y="92" class="tag">URL shortener split into 4 TypeScript microservices</text></g>
<g class="ln" style="animation-delay:0.33s"><text x="22" y="124" class="ar">▸</text><text x="38" y="124" class="b">Clicks via Redis Streams: p99 763 ms → 8 ms (k6)</text></g>
<g class="ln" style="animation-delay:0.42s"><text x="22" y="147" class="ar">▸</text><text x="38" y="147" class="b">30,000 / 30,000 clicks recorded at 500 req/s</text></g>
<g class="ln" style="animation-delay:0.51s"><text x="22" y="170" class="ar">▸</text><text x="38" y="170" class="b">GitHub Actions → GHCR → Argo CD GitOps on k8s</text></g>
<g class="ln" style="animation-delay:0.60s"><rect x="22" y="198" width="79.0" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="61.5" y="211" text-anchor="middle" class="chip">TypeScript</text><rect x="107.0" y="198" width="60.1" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="137.1" y="211" text-anchor="middle" class="chip">Express</text><rect x="173.1" y="198" width="79.0" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="212.6" y="211" text-anchor="middle" class="chip">PostgreSQL</text><rect x="258.1" y="198" width="47.5" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="281.9" y="211" text-anchor="middle" class="chip">Redis</text><rect x="311.6" y="198" width="79.0" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="351.1" y="211" text-anchor="middle" class="chip">Kubernetes</text><rect x="22" y="222" width="60.1" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="52.0" y="235" text-anchor="middle" class="chip">Argo CD</text><rect x="88.1" y="222" width="47.5" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="111.8" y="235" text-anchor="middle" class="chip">NGINX</text><rect x="141.6" y="222" width="28.6" height="19" rx="9.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="155.9" y="235" text-anchor="middle" class="chip">k6</text></g>
